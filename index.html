<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LED Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: same bench as Span Lab. Sidebar of rooms (learn / logic tools / discrete tools); each room is a workbench with inputs left and step-by-step output right */
:root{
  --bg:#f4f4f8;--panel:#ffffff;--ink:#16152a;--muted:#5b5a72;--faint:#8a89a0;
  --line:#e0dfea;--line2:#c6c4d6;--accent:#5b3cc4;--accent-bg:#ece8fb;
  --ok:#1d7442;--ok-bg:#e1f3e8;--bad:#b42318;--bad-bg:#fbe9e7;--hl:#fff1c7;--mark:#ffe08a;
  --c1:#5b3cc4;--c2:#0f8a72;--c3:#cf5226;--c4:#bf3876;--c5:#a8740c;--c6:#2b6cb0;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f18;--panel:#191826;--ink:#e9e8f3;--muted:#a5a3ba;--faint:#7d7b93;
  --line:#2a2839;--line2:#3c3a52;--accent:#a996ff;--accent-bg:#26214a;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--hl:#3a3218;--mark:#5a4a14;
  --c1:#a996ff;--c2:#3ccaa5;--c3:#f2845c;--c4:#ef72aa;--c5:#e2b443;--c6:#6fa8ef;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100f18;--panel:#191826;--ink:#e9e8f3;--muted:#a5a3ba;--faint:#7d7b93;
  --line:#2a2839;--line2:#3c3a52;--accent:#a996ff;--accent-bg:#26214a;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--hl:#3a3218;--mark:#5a4a14;
  --c1:#a996ff;--c2:#3ccaa5;--c3:#f2845c;--c4:#ef72aa;--c5:#e2b443;--c6:#6fa8ef;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body,input,textarea,code,.mono{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:400 44px/1 var(--display);margin:0;letter-spacing:-0.01em}
h1 em{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:66ch}
h2{font:500 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h3{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
button{font:500 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line2)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 8px}
input[type=text],input[type=number],textarea{font:500 15px/1.5 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;font-size:14px}
input[type=number]{width:84px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:3px;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;border-radius:6px;padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;align-items:start}
.panes{min-width:0;display:flex;flex-direction:column}
nav.tabs{display:flex;flex-direction:column;border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding-right:12px;gap:2px}
nav.tabs button{justify-content:flex-start;text-align:left;border:0;border-left:2px solid transparent;border-radius:0 7px 7px 0;padding:8px 12px;background:none;font-size:14px;color:var(--muted)}
nav.tabs button:hover{background:var(--panel)}
nav.tabs button[aria-selected="true"]{border-left-color:var(--accent);background:var(--panel);color:var(--ink)}
.navlbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 14px 6px}
.navlbl:first-child{padding-top:4px}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr);gap:16px}nav.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:static;padding-right:0}nav.tabs button{border-left:0;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);background:none}.navlbl{display:none}}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.bench.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:1180px){.bench,.bench.wide{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--faint)}
.err{font-size:13px;color:var(--bad);min-height:20px;margin:4px 0 2px}
.how{font-size:14px;color:var(--muted);line-height:1.65}
.how code,.mono,code{font:13.5px var(--mono);color:var(--ink)}
.how b{color:var(--ink);font-weight:500}
.status{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:500 13px/1 var(--body);padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.big{font:500 20px/1.4 var(--mono);overflow-wrap:anywhere}
.fx{font:500 15px/1.6 var(--mono);color:var(--ink);background:var(--bg);border-radius:7px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.scroll{overflow-x:auto;max-width:100%}
.kbd{display:flex;flex-wrap:wrap;gap:4px}
.kbd button{font:500 15px var(--mono);min-width:36px;justify-content:center;padding:6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:6px 10px}
.chips button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.presets button{font:500 12.5px var(--mono)}
/* truth tables */
table.tt{border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.tt th{font-weight:500;padding:4px 9px;color:var(--muted);border-bottom:1px solid var(--line2);white-space:nowrap}
.tt td{padding:4px 9px;text-align:center}
.tt td.sep,.tt th.sep{border-left:1px solid var(--line2)}
.tt tr.sel td{background:var(--accent-bg)}
.tt tr{cursor:pointer}
.tt td.v1{color:var(--ok)}.tt td.v0{color:var(--bad)}
.tt td.main{font-weight:700}
.tt tr.good td{background:var(--ok-bg)}
.tt tr.badrow td{background:var(--bad-bg)}
.tt td.dim{color:var(--faint)}
/* svg */
svg text{font-family:var(--mono)}
.svgbox{background:var(--bg);border-radius:10px;overflow:auto;max-width:100%}
.svgbox svg{display:block;margin:0 auto}
/* steps */
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count{font:500 13px var(--mono);min-width:70px;text-align:center;color:var(--muted)}
.op{font:500 14px var(--mono);color:var(--accent);min-height:22px;overflow-wrap:anywhere}
ol.chain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font:500 14.5px/1.5 var(--mono)}
ol.chain li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:baseline}
ol.chain li .n{color:var(--faint);font-size:12px;text-align:right}
ol.chain li .r{grid-column:2;font:12.5px var(--body);color:var(--accent)}
ol.chain li.cur{background:var(--hl);border-radius:6px}
ol.chain li.fut{opacity:.35}
/* ND */
.nd{font:500 14.5px/1.5 var(--mono);display:flex;flex-direction:column}
.ndrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 22px;gap:8px;align-items:center;min-height:30px}
.ndrow .ln{color:var(--faint);text-align:right;font-size:12.5px}
.ndrow .fm{position:relative;overflow-wrap:anywhere}
.ndrow .rails{position:absolute;left:0;top:-1px;bottom:-1px}
.ndrow .js{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ndrow .st{font-size:13px;text-align:center}
.ndrow.bad{background:var(--bad-bg);border-radius:6px}
.ndrow .ass{border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.nderr{grid-column:2/5;font:12.5px var(--body);color:var(--bad);margin:-4px 0 4px}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rule{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:500 13px/1.45 var(--mono);background:var(--bg)}
.rule b{display:block;font:600 12px var(--body);color:var(--accent);margin-bottom:4px}
.rule .fr{border-top:1.5px solid var(--ink);margin-top:3px;padding-top:2px}
/* predicates */
.vf{color:var(--bad);font-weight:700;text-decoration:underline dotted}
.vb.q0{color:var(--c1)}.vb.q1{color:var(--c2)}.vb.q2{color:var(--c3)}.vb.q3{color:var(--c4)}.vb.q4{color:var(--c5)}.vb.q5{color:var(--c6)}
details.ex{border-left:2px solid var(--line2);padding-left:10px;margin:3px 0}
details.ex summary{cursor:pointer;font:500 13.5px var(--mono)}
details.ex summary .t{color:var(--ok)}details.ex summary .f{color:var(--bad)}
/* matrices */
table.mx{border-collapse:collapse;font:500 13.5px var(--mono);font-variant-numeric:tabular-nums}
.mx th{font-weight:500;color:var(--muted);padding:3px 7px}
.mx td{padding:3px 7px;text-align:center;min-width:30px}
.mx td.on{background:var(--accent-bg);color:var(--accent);border-radius:4px}
.mx td.new{background:var(--hl)}
.mx td.dg{box-shadow:inset 0 0 0 1px var(--line2)}
.mx input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:500 14px var(--mono);overflow-wrap:anywhere}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.prop{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.prop .h{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.prop .w{font:12.5px var(--mono);color:var(--muted)}
.yes{color:var(--ok)}.no{color:var(--bad)}
/* practice */
.prac{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:1100px){.prac{grid-template-columns:minmax(0,1fr)}}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kind{font:500 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.prompt{font-size:17px;line-height:1.6}
.prompt .fx{font-size:16px;margin-top:6px}
.answers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answers button{font:500 14.5px var(--mono);line-height:1.4;text-align:left;white-space:normal}
.answers .wide{flex-direction:column;align-items:stretch;width:100%}
.answers input[type=text]{max-width:420px}
.fb{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.65}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .how{color:var(--ink)}
.hints{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hints li{font-size:14px;color:var(--muted);border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chipgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.chipgroup .g{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.review summary{cursor:pointer;font-size:14px}
.timer{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
/* theory */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note .alt{font:13px var(--mono);color:var(--faint)}
.note p{margin:0;color:var(--muted);font-size:14px}
.note p b{color:var(--ink);font-weight:500}
.note .f{font:500 14px/1.6 var(--mono);color:var(--ink);background:var(--bg);border-radius:7px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap}
.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);display:block;margin-bottom:2px}
.note .try{margin-top:auto;align-self:flex-start}
.ghead{font:500 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.ghead:first-child{margin-top:4px}
/* wizard */
.wiz{display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q .t{font-size:15px;min-width:210px}
.res{font:500 22px/1.3 var(--mono);overflow-wrap:anywhere}
.pascal{font:500 13px var(--mono);display:flex;flex-direction:column;align-items:center;gap:3px}
.pascal div{display:flex;gap:4px}
.pascal span{min-width:34px;text-align:center;padding:2px 3px;border-radius:5px}
.pascal span.on{background:var(--accent-bg);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>LED <em>Lab</em></h1>
    <p class="sub" data-en="Lógica y Estructuras Discretas, all in one bench: formulas, truth tables, normal forms, tableaux, natural deduction and predicates, then sets, relations, functions, counting and graphs. Every calculation is shown step by step, using standard notation." data-es="Lógica y Estructuras Discretas en un solo banco de trabajo: fórmulas, tablas de verdad, formas normales, tableaux, deducción natural y predicados; después conjuntos, relaciones, funciones, combinatoria y grafos. Cada cálculo se muestra paso a paso, con notación estándar."></p>
  </div>
  <div class="seg" role="group" aria-label="Language / Idioma">
    <button id="len" aria-pressed="true" onclick="setLang('en')">EN</button>
    <button id="les" aria-pressed="false" onclick="setLang('es')">ES</button>
  </div>
</header>

<div class="app">
<nav class="tabs" role="tablist" aria-orientation="vertical">
  <span class="navlbl" data-en="Learn" data-es="Aprender"></span>
  <button role="tab" id="tab-lab" onclick="showTab('lab')" data-en="Formula lab" data-es="Laboratorio"></button>
  <button role="tab" id="tab-practice" onclick="showTab('practice')" data-en="Practice" data-es="Ejercicios"></button>
  <button role="tab" id="tab-theory" onclick="showTab('theory')" data-en="Theory" data-es="Teoría"></button>
  <span class="navlbl" data-en="Logic" data-es="Lógica"></span>
  <button role="tab" id="tab-sem" onclick="showTab('sem')" data-en="Consequence &amp; equivalence" data-es="Consecuencia y equivalencia"></button>
  <button role="tab" id="tab-nf" onclick="showTab('nf')" data-en="Normal forms" data-es="Formas normales"></button>
  <button role="tab" id="tab-tab" onclick="showTab('tab')" data-en="Tableaux" data-es="Tableaux"></button>
  <button role="tab" id="tab-nd" onclick="showTab('nd')" data-en="Natural deduction" data-es="Deducción natural"></button>
  <button role="tab" id="tab-fo" onclick="showTab('fo')" data-en="Predicates" data-es="Predicados"></button>
  <span class="navlbl" data-en="Discrete structures" data-es="Estructuras discretas"></span>
  <button role="tab" id="tab-sets" onclick="showTab('sets')" data-en="Sets" data-es="Conjuntos"></button>
  <button role="tab" id="tab-rel" onclick="showTab('rel')" data-en="Relations" data-es="Relaciones"></button>
  <button role="tab" id="tab-fun" onclick="showTab('fun')" data-en="Functions" data-es="Funciones"></button>
  <button role="tab" id="tab-comb" onclick="showTab('comb')" data-en="Combinatorics" data-es="Combinatoria"></button>
  <button role="tab" id="tab-graph" onclick="showTab('graph')" data-en="Graphs" data-es="Grafos"></button>
</nav>
<div class="panes">

<!-- FORMULA LAB -->
<section id="p-lab" class="bench wide" hidden>
  <div class="side">
    <div class="block">
      <h2 data-en="Propositional formula" data-es="Fórmula proposicional"></h2>
      <input type="text" id="labin" autocomplete="off" spellcheck="false" aria-label="Formula">
      <div class="kbd" id="labkbd" style="margin-top:8px"></div>
      <div class="err" id="laberr" role="alert"></div>
      <div class="row presets" id="labpresets"></div>
      <p class="hint" style="margin:10px 0 0" data-en="Type with the buttons or with ASCII: <code>~ &amp; | -&gt; &lt;-&gt; T F</code>. Precedence ¬ > ∧ > ∨ > → > ↔, and a repeated connective groups to the left: p → q → r is (p → q) → r." data-es="Escribe con los botones o en ASCII: <code>~ &amp; | -&gt; &lt;-&gt; T F</code>. Precedencia ¬ > ∧ > ∨ > → > ↔, y una conectiva repetida agrupa por la izquierda: p → q → r es (p → q) → r."></p>
    </div>
    <div class="block">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0" data-en="Syntax tree" data-es="Árbol sintáctico"></h2><div class="row" id="labswitch"></div></div>
      <div class="svgbox" id="labtree"></div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--ok)"></i><span data-en="true (1)" data-es="verdadera (1)"></span></span><span><i style="background:var(--bad)"></i><span data-en="false (0)" data-es="falsa (0)"></span></span><span class="hint" data-en="Flip the atoms above or click a row of the table." data-es="Cambia los átomos de arriba o pulsa una fila de la tabla."></span></span></div>
    </div>
  </div>
  <div class="side">
    <div class="block">
      <h2 data-en="What this formula is" data-es="Qué es esta fórmula"></h2>
      <div class="status" id="labstatus"></div>
      <dl class="kv" id="labkv" style="margin:14px 0 0"></dl>
      <div class="row" style="margin-top:14px" id="labgo"></div>
    </div>
    <div class="block">
      <h2 data-en="Truth table with every subformula" data-es="Tabla de verdad con todas las subfórmulas"></h2>
      <div class="scroll" id="labtt"></div>
    </div>
    <div class="block">
      <h2 data-en="Generation sequence" data-es="Secuencia de generación"></h2>
      <ol class="chain" id="labseq"></ol>
    </div>
  </div>
</section>

<!-- PRACTICE -->
<section id="p-practice" class="prac" hidden>
  <div class="excard" id="excard"></div>
  <div class="side">
    <div class="block">

//  precedence ¬,∀,∃ (1) > ∧ (2) > ∨ (3) > → (4) > ↔ (5); repeated binary connectives group to the LEFT.
//  truth-table rows are listed from 1…1 down to 0…0.
const L = (() => {
  const SUB = '₀₁₂₃₄₅₆₇₈₉';
  const subDigits = s => s.replace(/[0-9]/g, d => SUB[+d]);

  // ---------- tokenizer ----------
  function tokenize(src, mode) {
    const s = unsub(src);

      if (rest.startsWith('/\\')) { toks.push({ k: 'and', p: i }); i += 2; continue; }
      if (rest.startsWith('\\/')) { toks.push({ k: 'or', p: i }); i += 2; continue; }
      if (rest.startsWith('\\A')) { toks.push({ k: 'all', p: i }); i += 2; continue; }

      if ('¬~!-'.includes(c)) { toks.push({ k: 'not', p: i }); i++; continue; }
      if (c === '∀') { toks.push({ k: 'all', p: i }); i++; continue; }
      if (c === '∃') { toks.push({ k: 'ex', p: i }); i++; continue; }
      if (c === '(' || c === '[' || c === '{') { toks.push({ k: '(', p: i }); i++; continue; }
      if (c === ')' || c === ']' || c === '}') { toks.push({ k: ')', p: i }); i++; continue; }
      if (c === ',') { toks.push({ k: ',', p: i }); i++; continue; }
      if (c === '⊤') { toks.push({ k: 'top', p: i }); i++; continue; }
      if (c === '⊥') { toks.push({ k: 'bot', p: i }); i++; continue; }
      if (c === '=') { toks.push({ k: '=', p: i }); i++; continue; }
      if (c === '≠') { toks.push({ k: '≠', p: i }); i++; continue; }

        if ((m = rest.match(/^[A-Z][0-9]*/))) { toks.push({ k: 'pred', v: m[0], p: i }); i += m[0].length; continue; }

  // ---------- parser ----------

          if (!g.args.length) return g.n;

        case 'eq': return termStr(g.l) + ' = ' + termStr(g.r);

        }
        case 'all': case 'ex': {

          return (g.t === 'all' ? '∀' : '∃') + subDigits(g.v) + (isBin(g.a) || g.a.t === 'eq' ? '(' + c + ')' : c);

  }
  const prefix = f => {
    switch (f.t) {
      case 'atom': return subDigits(f.n);
      case 'top': return '⊤'; case 'bot': return '⊥';
      case 'not': return '¬' + prefix(f.a);

  };

    switch (f.t) {
      case 'atom': return subDigits(f.n);
      case 'top': return '⊤'; case 'bot': return '⊥';
      case 'not': return '[¬, ' + listForm(f.a) + ']';
      case 'all': case 'ex': return `[${f.t === 'all' ? '∀' : '∃'}${f.v}, ${listForm(f.a)}]`;

  // ---------- structure ----------

      if (g.b) rec(g.b);

      if (!seen.has(k)) { seen.add(k); out.push(g); }
    })(f);

  }
  function depth(f) { return f.a ? 1 + Math.max(depth(f.a), f.b ? depth(f.b) : 0) : 0; }
  function size(f) { return 1 + (f.a ? size(f.a) : 0) + (f.b ? size(f.b) : 0); }

    const set = new Set();
    const rec = g => { if (g.t === 'atom') set.add(g.n); if (g.a) rec(g.a); if (g.b) rec(g.b); };

  function getAt(f, path) { let g = f; for (const c of path) g = g[c]; return g; }

    if (!path) return rep;
    const c = path[0];
    const copy = { ...f };
    copy[c] = setAt(f[c], path.slice(1), rep);
    return copy;
  }

  // ---------- propositional semantics ----------
  function ev(f, v) {
    switch (f.t) {
      case 'atom': return v[f.n] ? 1 : 0;
      case 'top': return 1; case 'bot': return 0;
      case 'not': return 1 - ev(f.a, v);
      case 'and': return Math.min(ev(f.a, v), ev(f.b, v));
      case 'or': return Math.max(ev(f.a, v), ev(f.b, v));

  function assignments(atoms) {
    const n = atoms.length, rows = [];

      const v = {};
      atoms.forEach((a, i) => { v[a] = (k >> (n - 1 - i)) & 1; });
      rows.push(v);
    }
    return rows;
  }
  function table(fs, atoms) {
    atoms = atoms || atomsOf(fs);
    return assignments(atoms).map(v => ({ v, vals: fs.map(f => ev(f, v)) }));
  }
  function classify(f) {
    const vals = table([f]).map(r => r.vals[0]);
    const ones = vals.filter(x => x).length;
    return { kind: ones === vals.length ? 'taut' : ones === 0 ? 'contra' : 'cont', ones, rows: vals.length };
  }
  function equivalent(f, g) {
    const at = atomsOf([f, g]);

    const at = atomsOf(f);

    const e = l.err ? (typeof l.err === 'string' ? trErr(l.err) : TT(l.err)) : '';
    return `<div class="ndrow ${e ? 'bad' : ''}"><span class="ln">${l.num}</span><span class="fm" style="padding-left:${d * 14 + (d ? 6 : 0)}px">${rails}<span class="${l.rule === 'S' ? 'ass' : ''}">${esc(ftxt)}</span></span><span class="js">${just}</span><span class="st ${e ? 'no' : 'yes'}">${e ? '✗' : '✓'}</span></div>${e ? `<div class="nderr">${esc(e)}</div>` : ''}`;
  });

    const claim = `${r.prem.map(f => F(f)).join(', ')} ⊢ ${F(r.concl)}`;

    } catch (e) { }
  } else if (r.lines.length) {
    const nbad = r.lines.filter(l => l.err).length;

  }
  $('ndverdict').innerHTML = v;
}

function parseMap(txt) {

}
function arrowSVG(A, B, pairs, labelA = 'A', labelB = 'B', bad) {

  pairs.forEach(([a, b]) => { const i = A.indexOf(a), j = B.indexOf(b); if (i < 0 || j < 0) return; const isBad = bad && bad.has(a); s += `<line x1="80" y1="${ya(i)}" x2="232" y2="${yb(j)}" stroke="${isBad ? 'var(--bad)' : 'var(--muted)'}" stroke-width="1.6" marker-end="url(#arr)"/>`; });

  { g: 'sem', en: 'Equivalence', es: 'Equivalencia', d: B2('X ≡ Y when they have the same value in every interpretation (identical truth-table columns).', 'X ≡ Y cuando tienen el mismo valor en toda interpretación (columnas idénticas en la tabla).'), ex: 'p → q ≡ ¬q → ¬p ≡ ¬p ∨ q', tr: B2('X ≡ Y ⇔ X ↔ Y is a tautology ⇔ X ⊨ Y and Y ⊨ X. ≡ is reflexive, symmetric and transitive.', 'X ≡ Y ⇔ X ↔ Y es tautología ⇔ X ⊨ Y e Y ⊨ X. ≡ es reflexiva, simétrica y transitiva.'), trap: B2('≡ is a statement about formulas (metalanguage); ↔ is a connective inside a formula. The converse q → p is NOT equivalent to p → q.', '≡ es una afirmación sobre fórmulas (metalenguaje); ↔ es una conectiva dentro de una fórmula. El recíproco q → p NO es equivalente a p → q.'), go: () => loadSem({mode:'equiv',X:'p → q',Y:'¬q → ¬p'}) },
  { g: 'sem', en: 'Logical consequence', es: 'Consecuencia lógica', d: B2('Γ ⊨ C when every interpretation that satisfies all of Γ also satisfies C: M(Γ) ⊆ M(C).', 'Γ ⊨ C cuando toda interpretación que satisface todo Γ satisface también C: M(Γ) ⊆ M(C).'), ex: '{p ∧ q, q → r} ⊨ r', tr: B2('Three equivalent tests: (X₁ ∧ … ∧ Xₙ) → C is a tautology; Γ ∪ {¬C} is unsatisfiable; no row has all premises 1 and C 0.', 'Tres pruebas equivalentes: (X₁ ∧ … ∧ Xₙ) → C es tautología; Γ ∪ {¬C} es insatisfacible; ninguna fila tiene todas las premisas a 1 y C a 0.'), trap: B2('Consequence is monotone (more premises keep every consequence) and an inconsistent Γ entails anything. Affirming the consequent ({p → q, q} ⊨ p) is NOT valid.', 'La consecuencia es monótona (más premisas conservan toda consecuencia) y un Γ inconsistente implica cualquier cosa. Afirmar el consecuente ({p → q, q} ⊨ p) NO es válido.'), go: () => loadSem({mode:'cons',G:'p ∧ q\nq → r',C:'r'}) },
  { g: 'sem', en: 'Formalizing sentences', es: 'Formalizar enunciados', d: B2('Choose an atom for each simple statement and translate the connecting words.', 'Elige un átomo para cada enunciado simple y traduce las partículas que los unen.'), ex: 'A only if B: A → B\nA if B: B → A\nA unless B: A ∨ B (¬B → A)\nneither A nor B: ¬A ∧ ¬B\nB is necessary for A: A → B', tr: B2('“Only if” points at the consequent. “Sufficient” goes in the antecedent, “necessary” in the consequent.', '«Sólo si» señala al consecuente. Lo «suficiente» va en el antecedente, lo «necesario» en el consecuente.'), trap: B2('“Either A or B” in everyday speech may be exclusive; ∨ is inclusive. Exclusive: (A ∨ B) ∧ ¬(A ∧ B).', '«O A o B» en el habla cotidiana puede ser excluyente; ∨ es inclusiva. Excluyente: (A ∨ B) ∧ ¬(A ∧ B).') },
  // ---- calculi
  { g: 'calc', en: 'Basic equivalences and replacement', es: 'Equivalencias básicas y reemplazo', d: B2('Replacing a subformula by an equivalent one gives an equivalent formula. This turns the laws below into a calculation tool.', 'Reemplazar una subfórmula por otra equivalente da una fórmula equivalente. Así las leyes de abajo se convierten en una herramienta de cálculo.'), ex: '¬¬X ≡ X · X ∨ X ≡ X · X ∨ ⊥ ≡ X · X ∧ ⊤ ≡ X\nX ∨ (Y ∧ X) ≡ X (absorption) · X ∨ ¬X ≡ ⊤ · X ∧ ¬X ≡ ⊥\nX ∨ (Y ∧ Z) ≡ (X ∨ Y) ∧ (X ∨ Z)\n¬(X ∨ Y) ≡ ¬X ∧ ¬Y · ¬(X ∧ Y) ≡ ¬X ∨ ¬Y\nX → Y ≡ ¬X ∨ Y ≡ ¬Y → ¬X\nX ↔ Y ≡ (X → Y) ∧ (Y → X) ≡ (X ∧ Y) ∨ (¬X ∧ ¬Y)', tr: B2('You may replace just one occurrence: the theorem does not ask you to replace them all.', 'Puedes reemplazar una sola aparición: el teorema no exige reemplazarlas todas.'), trap: B2('Uniform substitution (every p at once) only preserves tautologies and contradictions; replacement by an equivalent works on any formula.', 'La sustitución uniforme (todas las p a la vez) sólo preserva tautologías y contradicciones; el reemplazo por equivalente funciona en cualquier fórmula.'), go: () => loadNF('p → ¬(q → p)') },
  { g: 'calc', en: 'Normal forms (CNF, DNF)', es: 'Formas normales (FNC, FND)', d: B2('A literal is p or ¬p. CNF: a conjunction of clauses, each a disjunction of literals. DNF: a disjunction of conjunctions of literals.', 'Un literal es p o ¬p. FNC: conjunción de cláusulas, cada una disyunción de literales. FND: disyunción de conjunciones de literales.'), ex: '[1] X ↔ Y ≡ (X → Y) ∧ (Y → X)\n[2] X → Y ≡ ¬X ∨ Y\n[3] De Morgan  [4] ¬¬X ≡ X\n[5] distribute', tr: B2('From the table: DNF = one conjunction per row where X = 1 (V_ijk); CNF = one disjunction per row where X = 0 (F_ijk), with the atoms negated where the row has 1. Shorten by joining clauses that differ in one literal.', 'Desde la tabla: FND = una conjunción por fila con X = 1 (V_ijk); FNC = una disyunción por fila con X = 0 (F_ijk), negando los átomos que valen 1 en esa fila. Se acorta uniendo cláusulas que difieren en un literal.'), trap: B2('A tautology simplifies to ⊤ and a contradiction to ⊥: watch for clauses with p and ¬p.', 'Una tautología se simplifica a ⊤ y una contradicción a ⊥: vigila las cláusulas con p y ¬p.'), go: () => loadNF('p ↔ ¬(q ∨ r)') },
  { g: 'calc', en: 'Clauses as rules · Horn clauses', es: 'Cláusulas como reglas · Cláusulas de Horn', d: B2('A clause can be written as a conditional: negated literals go (un-negated) into a conjunction in the antecedent, positive ones into a disjunction in the consequent. Γ is as satisfiable as the set of all clauses of its CNFs.', 'Una cláusula se puede escribir como condicional: los literales negados pasan (sin negar) a una conjunción en el antecedente, los positivos a una disyunción en el consecuente. Γ es tan satisfacible como el conjunto de todas las cláusulas de sus FNC.'), ex: 'p ∨ ¬q ∨ ¬r ∨ s ≡ (q ∧ r) → (p ∨ s)\np ∨ q ≡ ⊤ → (p ∨ q) · ¬p ∨ ¬q ≡ (p ∧ q) → ⊥', tr: B2('Horn clause: at most one positive literal, so a rule (p ∧ q ∧ r) → s with one conclusion. Facts propagate forward through such rules.', 'Cláusula de Horn: a lo sumo un literal positivo, es decir, una regla (p ∧ q ∧ r) → s con una sola conclusión. Los hechos se propagan hacia delante por estas reglas.'), trap: B2('(p ∧ q) → (r ∨ s) is not Horn: two positive literals.', '(p ∧ q) → (r ∨ s) no es de Horn: dos literales positivos.'), go: () => loadNF('(p ∧ q → r) ∧ (q → s)') },
  { g: 'calc', en: 'Tableaux', es: 'Tableaux', d: B2('Start with the set Γ and expand: linear rules (α) add both parts to the branch, branching rules (β) split it. A branch closes when it contains a literal and its negation. If every branch closes, Γ is unsatisfiable; a fully expanded open branch gives a model.', 'Se empieza con el conjunto Γ y se expande: las reglas lineales (α) añaden ambas partes a la rama, las de bifurcación (β) la dividen. Una rama se cierra si contiene un literal y su negación. Si todas cierran, Γ es insatisfacible; una rama abierta completamente expandida da un modelo.'), ex: 'α: X ∧ Y · ¬(X ∨ Y) · ¬(X → Y) · ¬¬X\nβ: X ∨ Y · ¬(X ∧ Y) · X → Y · X ↔ Y · ¬(X ↔ Y)', tr: B2('Expand linear nodes before branching ones: smaller trees. A node is expanded once per branch below it.', 'Expande antes los nodos lineales que los que bifurcan: árboles más pequeños. Un nodo se expande una vez en cada rama por debajo de él.'), trap: B2('X ↔ Y branches into (X, Y | ¬X, ¬Y) and ¬(X ↔ Y) into (X, ¬Y | ¬X, Y): two formulas on each side.', 'X ↔ Y bifurca en (X, Y | ¬X, ¬Y) y ¬(X ↔ Y) en (X, ¬Y | ¬X, Y): dos fórmulas en cada lado.'), go: () => loadTab({lang:'prop',goal:'sat',S:'p ↔ q\nq → r\n¬(p → r)'}) },
  { g: 'calc', en: 'What to start a tableau with', es: 'Con qué empezar un tableau', d: B2('A tableau only decides satisfiability, so every other question is turned into one.', 'Un tableau sólo decide satisfacibilidad, así que toda otra pregunta se transforma en una.'), ex: 'X valid?        start with {¬X}\nΓ ⊨ C?          start with Γ ∪ {¬C}\nX ≡ Y?          start with {¬(X ↔ Y)}\nClosed ⇒ yes.  Open complete branch ⇒ no (and a counter-model).', tr: B2('Read the counter-model from the open branch: atoms that appear positive are 1, negated ones 0, the rest free.', 'Lee el contramodelo de la rama abierta: los átomos que aparecen positivos valen 1, los negados 0, el resto libres.'), trap: B2('Never start with C itself: you must negate the conclusion.', 'Nunca empieces con la propia C: hay que negar la conclusión.'), go: () => loadTab({lang:'prop',goal:'cons',G:'p ∨ q\np → r\nq → r',C:'r'}) },
  // ---- natural deduction
  { g: 'nd', en: 'Rules for ∧ and ∨', es: 'Reglas de ∧ y ∨', d: B2('∧I: from A and B, A ∧ B. ∧E: from A ∧ B, A (or B). ∨I: from A, A ∨ B (or B ∨ A). ∨E: from A ∨ B, a box A … C and a box B … C, conclude C.', '∧I: de A y B, A ∧ B. ∧E: de A ∧ B, A (o B). ∨I: de A, A ∨ B (o B ∨ A). ∨E: de A ∨ B, una caja A … C y otra B … C, se concluye C.'), ex: '1 (p ∧ (q → r)) ∨ ((q → r) ∧ ¬s)   Premisa\n2 │ p ∧ (q → r)                  Supuesto\n3 │ q → r                        ∧E 2\n4 │ (q → r) ∧ ¬s                 Supuesto\n5 │ q → r                        ∧E 4\n6 q → r                          ∨E 1, 2–3, 4–5', tr: B2('With a disjunctive premise, set up the two boxes first: you know how each begins (A, B) and ends (the goal).', 'Con una premisa disyuntiva, plantea primero las dos cajas: sabes cómo empieza cada una (A, B) y cómo acaba (el objetivo).'), trap: B2('From A ∨ B you cannot conclude A: that is why ∨E needs both boxes.', 'De A ∨ B no se puede concluir A: por eso ∨E necesita las dos cajas.'), go: () => ndOpen(1) },
  { g: 'nd', en: 'Rules for → and ↔', es: 'Reglas de → y ↔', d: B2('→E (modus ponens): from A → B and A, B. →I: open a box assuming A, reach B, close it and write A → B. ↔E: from A ↔ B and one side, the other. ↔I: a box A … B and a box B … A.', '→E (modus ponens): de A → B y A, B. →I: abre una caja suponiendo A, llega a B, ciérrala y escribe A → B. ↔E: de A ↔ B y un lado, el otro. ↔I: una caja A … B y otra B … A.'), ex: '1 p → q    Premisa\n2 q → r    Premisa\n3 │ p      Supuesto\n4 │ q      →E 1,3\n5 │ r      →E 2,4\n6 p → r    →I 3–5', tr: B2('To prove a conditional, assume its antecedent. Without premises, ⊢ C proves that C is a tautology.', 'Para demostrar un condicional, supón su antecedente. Sin premisas, ⊢ C demuestra que C es tautología.'), trap: B2('Lines inside a closed box (q and r above) are not consequences of the premises alone: they cannot be used after line 5.', 'Las líneas de una caja cerrada (q y r arriba) no son consecuencia de las premisas solas: no se pueden usar tras la línea 5.'), go: () => ndOpen(0) },
  { g: 'nd', en: 'Negation, ⊥ and reductio', es: 'Negación, ⊥ y reducción al absurdo', d: B2('¬I: a box that starts with A and reaches both X and ¬X (or ⊥) lets you write ¬A. ¬E: from ¬¬A, A. ⊥I: from X and ¬X, ⊥. ⊥E: from ⊥, anything.', '¬I: una caja que empieza con A y llega a X y a ¬X (o a ⊥) permite escribir ¬A. ¬E: de ¬¬A, A. ⊥I: de X y ¬X, ⊥. ⊥E: de ⊥, cualquier cosa.'), ex: '1 p ∧ ¬q          Premisa\n2 │ ¬¬(p → q)     Supuesto\n3 │ p → q         ¬E 2\n4 │ p             ∧E 1\n5 │ q             →E 3,4\n6 │ ¬q            ∧E 1\n7 ¬¬¬(p → q)      ¬I 2–6\n8 ¬(p → q)        ¬E 7', tr: B2('Reductio for a goal A: assume ¬A, reach a contradiction, get ¬¬A by ¬I, then A by ¬E.', 'Reducción al absurdo para un objetivo A: supón ¬A, llega a una contradicción, obtén ¬¬A por ¬I y luego A por ¬E.'), trap: B2('Reiteration copies a line into deeper boxes, never from inside a box to the outside.', 'La reiteración copia una línea hacia cajas interiores, nunca desde dentro de una caja hacia fuera.'), go: () => ndOpen(6) },
  { g: 'nd', en: 'Derived rules · soundness and completeness', es: 'Reglas derivadas · corrección y completitud', d: B2('A derived rule abbreviates a fixed derivation. We use MT (A → C, ¬C ⊢ ¬A), SH (A → B, B → C ⊢ A → C) and SD (A ∨ B, ¬B ⊢ A).', 'Una regla derivada abrevia una derivación fija. Se usan MT (A → C, ¬C ⊢ ¬A), SH (A → B, B → C ⊢ A → C) y SD (A ∨ B, ¬B ⊢ A).'), ex: 'Γ ⊢ C ⇒ Γ ⊨ C   (sound)\nΓ ⊨ C ⇒ Γ ⊢ C   (complete)', tr: B2('Build exercises yourself: from an equivalence A ≡ B you get two proofs, A ⊢ B and B ⊢ A.', 'Fabrica ejercicios: de una equivalencia A ≡ B salen dos demostraciones, A ⊢ B y B ⊢ A.'), trap: B2('⊢ is syntactic (a derivation exists), ⊨ is semantic (truth in every model). The theorems say they coincide.', '⊢ es sintáctico (existe una derivación), ⊨ es semántico (verdad en todo modelo). Los teoremas dicen que coinciden.'), go: () => ndOpen(21) },
  // ---- predicates
  { g: 'fo', en: 'Terms, predicates and formulas', es: 'Términos, predicados y fórmulas', d: B2('Terms: constants (a, b, c, …), variables (…, x, y, z) and functions g(t₁, …, tₙ). Atomic formulas: Rt₁…tₙ or t₁ = t₂. Then ¬, binary connectives and quantifiers ∀x, ∃x.', 'Términos: constantes (a, b, c, …), variables (…, x, y, z) y funciones g(t₁, …, tₙ). Fórmulas atómicas: Rt₁…tₙ o t₁ = t₂. Después ¬, conectivas binarias y cuantificadores ∀x, ∃x.'), ex: 'Tj · Vjm · Mond · Pm(p(a)) · ∀x(Mx → Vx)', tr: B2('Quantifiers have the precedence of ¬: ∀xPx → Qx is (∀xPx) → Qx.', 'Los cuantificadores tienen la precedencia de ¬: ∀xPx → Qx es (∀xPx) → Qx.'), trap: B2('Never drop the parentheses of a function: Rf(a)b is binary R of f(a) and b; Rfab would read differently.', 'Nunca quites los paréntesis de una función: Rf(a)b es R binaria de f(a) y b; Rfab se leería de otra forma.'), go: () => foOpen('∀x(Px → ∃zRxz)') },
  { g: 'fo', en: 'Free and bound variables · sentences', es: 'Variables libres y ligadas · sentencias', d: B2('The scope of Qx is the formula right after it. Occurrences of x in that scope are bound by it; the others are free. A sentence has no free occurrences.', 'El ámbito de Qx es la fórmula que va justo detrás. Las apariciones de x en ese ámbito quedan ligadas por él; las demás son libres. Una sentencia no tiene apariciones libres.'), ex: '∀x∃y(Qxy ∧ Rzf(x)) ∨ (Px → ∀ySyz)\nx: bound and free · y: bound twice · z: free', tr: B2('Read the tree bottom-up: only a quantifier on x changes the status of x.', 'Lee el árbol de abajo arriba: sólo un cuantificador sobre x cambia el estado de x.'), trap: B2('The ∀x at the start does not reach Px after the ∨: its scope ends at the bracket.', 'El ∀x del principio no llega a la Px tras la ∨: su ámbito acaba en el paréntesis.'), go: () => foOpen('∀x∃y(Qxy ∧ Rzf(x)) ∨ (Px → ∀ySyz)') },
  { g: 'fo', en: 'Interpretations and truth', es: 'Interpretaciones y verdad', d: B2('An interpretation fixes a non-empty universe U, an element cᴵ for each constant, a subset Pᴵ ⊆ U (or Rᴵ ⊆ U × U, …) for each predicate and a function for each function symbol. An assignment σ gives values to free variables.', 'Una interpretación fija un universo U no vacío, un elemento cᴵ por constante, un subconjunto Pᴵ ⊆ U (o Rᴵ ⊆ U × U, …) por predicado y una función por símbolo de función. Una asignación σ da valor a las variables libres.'), ex: 'U = {1, 2, 3}, Pᴵ = {1, 3}, bᴵ = 3  ⇒  I ⊨ Pb', tr: B2('On a finite U, ∀xF is the conjunction F(1) ∧ F(2) ∧ … and ∃xF the disjunction: a loop that needs all “yes” or one “yes”.', 'En un U finito, ∀xF es la conjunción F(1) ∧ F(2) ∧ … y ∃xF la disyunción: un bucle que necesita todo «sí» o un «sí».'), trap: B2('∀x∃yRxy and ∃y∀xRxy differ: in the first each x may pick its own y.', '∀x∃yRxy y ∃y∀xRxy son distintas: en la primera cada x puede elegir su propio y.'), go: () => showTab('fo') },
  { g: 'fo', en: 'Formalizing with quantifiers', es: 'Formalizar con cuantificadores', d: B2('The universal goes with a conditional, the existential with a conjunction.', 'El universal va con condicional, el existencial con conjunción.'), ex: 'All M are V:      ∀x(Mx → Vx)\nSome M is V:       ∃x(Mx ∧ Vx)\nNo M is V:         ∀x(Mx → ¬Vx) ≡ ¬∃x(Mx ∧ Vx)\nNot all M are V:   ∃x(Mx ∧ ¬Vx)', tr: B2('Check by reading back: ∃x(Mx → Vx) is true as soon as something is not M, so it cannot mean “some M is V”.', 'Comprueba releyendo: ∃x(Mx → Vx) es verdad en cuanto algo no es M, así que no puede significar «algún M es V».'), trap: B2('∀x(Mx ∧ Vx) says everything is both M and V.', '∀x(Mx ∧ Vx) dice que todo es a la vez M y V.') },
  { g: 'fo', en: 'Negating quantifiers', es: 'Negar cuantificadores', d: B2('¬∀xF ≡ ∃x¬F and ¬∃xF ≡ ∀x¬F. Also ∀xF ≡ ¬∃x¬F and ∃xF ≡ ¬∀x¬F.', '¬∀xF ≡ ∃x¬F y ¬∃xF ≡ ∀x¬F. También ∀xF ≡ ¬∃x¬F y ∃xF ≡ ¬∀x¬F.'), ex: '¬∀x(Px → (Mx ∧ ∃y∀zRyz))\n≡ ∃x(Px ∧ (¬Mx ∨ ∀y∃z¬Ryz))', tr: B2('Push ¬ inwards one step at a time: each quantifier it crosses flips, then use De Morgan and ¬(A → B) ≡ A ∧ ¬B.', 'Mete ¬ un paso cada vez: cada cuantificador que cruza cambia, después De Morgan y ¬(A → B) ≡ A ∧ ¬B.'), trap: B2('“Not everyone is a journalist” is ∃x¬Px, not ∀x¬Px.', '«No todos son periodistas» es ∃x¬Px, no ∀x¬Px.'), go: () => foOpen('¬∀x(Px → ∃yRxy)') },
  { g: 'fo', en: 'Renaming and moving quantifiers', es: 'Renombrar y desplazar cuantificadores', d: B2('If x is not free in F: (F ∗ QxG) ≡ Qx(F ∗ G) for ∗ ∈ {∧, ∨}. Specific rules: ∀xF ∧ ∀xG ≡ ∀x(F ∧ G) and ∃xF ∨ ∃xG ≡ ∃x(F ∨ G). Repeating this gives the prenex form.', 'Si x no está libre en F: (F ∗ QxG) ≡ Qx(F ∗ G) con ∗ ∈ {∧, ∨}. Reglas específicas: ∀xF ∧ ∀xG ≡ ∀x(F ∧ G) y ∃xF ∨ ∃xG ≡ ∃x(F ∨ G). Repitiéndolo se llega a la forma prenexa.'), ex: '¬(∀x∃yRxy → ∃z∀yRzy)\n≡ ∀x∃y∀z∃w(Rxy ∧ ¬Rzw)', tr: B2('When the variable is free on the other side, rename the bound one first: [x/w] in QxF, choosing a w that captures nothing.', 'Cuando la variable está libre en el otro lado, renombra antes la ligada: [x/w] en QxF, eligiendo un w que no capture nada.'), trap: B2('∀x(Px ∨ Qx) ⊭ ∀xPx ∨ ∀xQx and ∃xPx ∧ ∃xQx ⊭ ∃x(Px ∧ Qx): no common factor for ∀ with ∨ or ∃ with ∧.', '∀x(Px ∨ Qx) ⊭ ∀xPx ∨ ∀xQx y ∃xPx ∧ ∃xQx ⊭ ∃x(Px ∧ Qx): no hay factor común de ∀ con ∨ ni de ∃ con ∧.'), go: () => foOpen('¬(∀x∃yRxy → ∃z∀yRzy)') },
  { g: 'fo', en: 'First-order tableaux', es: 'Tableaux de primer orden', d: B2('Add instantiation rules to the propositional ones. γ: ∀xF and ¬∃xF give F(a) or ¬F(a) for any constant, as often as needed. δ: ∃xF and ¬∀xF give F(a) or ¬F(a) for a NEW constant, once per branch.', 'A las reglas proposicionales se añaden las de instanciación. γ: ∀xF y ¬∃xF dan F(a) o ¬F(a) con cualquier constante, tantas veces como haga falta. δ: ∃xF y ¬∀xF dan F(a) o ¬F(a) con una constante NUEVA, una vez por rama.'), ex: '[1] ∀xPx\n[2] ∃x¬Px\n[3] ¬Pa  (2, new a)\n[4] Pa   (1)   ×', tr: B2('Expand existentials as early as possible, then choose the constants of the universals so that branches close.', 'Expande los existenciales cuanto antes y elige después las constantes de los universales para que cierren las ramas.'), trap: B2('Reusing an old constant in a δ step can close a tableau of a satisfiable set ({∃xPx, ∃x¬Px}). Always expand the main operator: never the inner ∃ of ∀x(… ∃y …).', 'Reutilizar una constante en un paso δ puede cerrar el tableau de un conjunto satisfacible ({∃xPx, ∃x¬Px}). Expande siempre el operador principal: nunca el ∃ interior de ∀x(… ∃y …).'), go: () => loadTab({lang:'pred',goal:'sat',S:'∀x(Px → ¬Qx)\n∃x(Px ∧ Rx)\n¬∃x(¬Qx ∧ Rx)'}) },
  // ---- sets
  { g: 'sets', en: 'Sets and equality', es: 'Conjuntos e igualdad', d: B2('A set is defined by extension {1, 2, 3} or by comprehension {x | Px}. Two sets are equal when they have the same elements: A = B ↔ ∀x(x ∈ A ↔ x ∈ B).', 'Un conjunto se define por extensión {1, 2, 3} o por comprensión {x | Px}. Dos conjuntos son iguales cuando tienen los mismos elementos: A = B ↔ ∀x(x ∈ A ↔ x ∈ B).'), ex: '{Ana, Juan, Marta} = {Juan, Marta, Ana, Juan}', tr: B2('Order and repetitions do not matter. To prove A ≠ B, one element in one and not in the other is enough.', 'No importan el orden ni las repeticiones. Para probar A ≠ B basta un elemento que esté en uno y no en el otro.'), trap: B2('{Marcos, {Juan, Irene}, Ana} has 3 elements, not 4. The empty set is unique: ∅.', '{Marcos, {Juan, Irene}, Ana} tiene 3 elementos, no 4. El conjunto vacío es único: ∅.') },
  { g: 'sets', en: 'Subset and element', es: 'Subconjunto y elemento', d: B2('A ⊆ B when every element of A is in B. A ⊂ B (proper subset) when also A ≠ B. ⊆ is reflexive, transitive and antisymmetric.', 'A ⊆ B cuando todo elemento de A está en B. A ⊂ B (subconjunto propio) cuando además A ≠ B. ⊆ es reflexiva, transitiva y antisimétrica.'), ex: 'A = {1, 2, 3}, C = {A, 6}:  A ∈ C, A ⊈ C', tr: B2('A = B ⇔ A ⊆ B and B ⊆ A: the standard way to prove two sets equal.', 'A = B ⇔ A ⊆ B y B ⊆ A: la forma habitual de probar que dos conjuntos son iguales.'), trap: B2('∈ relates an element to a set, ⊆ a set to a set. ∅ ⊆ A for every A, but ∅ ∈ A only if ∅ is listed as an element.', '∈ relaciona elemento con conjunto, ⊆ conjunto con conjunto. ∅ ⊆ A para todo A, pero ∅ ∈ A sólo si ∅ figura como elemento.'), go: () => showTab('sets') },
  { g: 'sets', en: 'Power set', es: 'Conjunto potencia', d: B2('P(A) = {M | M ⊆ A}, the set of all subsets of A. M ∈ P(A) ↔ M ⊆ A.', 'P(A) = {M | M ⊆ A}, el conjunto de todos los subconjuntos de A. M ∈ P(A) ↔ M ⊆ A.'), ex: 'P({1, 2}) = {∅, {1}, {2}, {1, 2}}', tr: B2('|P(A)| = 2^|A|: each element is a switch, in or out. That is why P(A) is also written 2ᴬ.', '|P(A)| = 2^|A|: cada elemento es un interruptor, dentro o fuera. Por eso P(A) también se escribe 2ᴬ.'), trap: B2('∅ and A itself are always elements of P(A). The elements of A are not elements of P(A) (1 ∉ P(A), but {1} ∈ P(A)).', '∅ y el propio A siempre son elementos de P(A). Los elementos de A no son elementos de P(A) (1 ∉ P(A), pero {1} ∈ P(A)).') },
  { g: 'sets', en: 'Operations and their laws', es: 'Operaciones y sus leyes', d: B2('A ∩ B = {x | x ∈ A ∧ x ∈ B}, A ∪ B = {x | x ∈ A ∨ x ∈ B}, Aᶜ = {x ∈ U | x ∉ A}, A ∖ B = {x ∈ A | x ∉ B} = A ∩ Bᶜ.', 'A ∩ B = {x | x ∈ A ∧ x ∈ B}, A ∪ B = {x | x ∈ A ∨ x ∈ B}, Aᶜ = {x ∈ U | x ∉ A}, A ∖ B = {x ∈ A | x ∉ B} = A ∩ Bᶜ.'), ex: 'associative, commutative, distributive\nA ∪ ∅ = A, A ∩ U = A, A ∪ Aᶜ = U, A ∩ Aᶜ = ∅\nidempotence, domination, absorption\n(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ, (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ, (Aᶜ)ᶜ = A', tr: B2('Every set law is a propositional law in disguise: ∩ is ∧, ∪ is ∨, ᶜ is ¬ applied to “x ∈ …”. Check identities with a membership table.', 'Toda ley de conjuntos es una ley lógica disfrazada: ∩ es ∧, ∪ es ∨, ᶜ es ¬ aplicada a «x ∈ …». Comprueba identidades con una tabla de pertenencia.'), trap: B2('A ∖ (B ∩ C) = (A ∖ B) ∪ (A ∖ C), with ∪, not ∩.', 'A ∖ (B ∩ C) = (A ∖ B) ∪ (A ∖ C), con ∪, no con ∩.'), go: () => showTab('sets') },
  { g: 'sets', en: 'Partitions', es: 'Particiones', d: B2('A collection of subsets of A is a partition when no block is empty, the blocks are pairwise disjoint, and their union is A. A covering only needs the union to be A.', 'Una colección de subconjuntos de A es una partición cuando ningún bloque es vacío, los bloques son disjuntos dos a dos y su unión es A. Un recubrimiento sólo exige que la unión sea A.'), ex: 'A = {1, …, 7}: {{1, 2}, {3, 4, 5}, {6, 7}}', tr: B2('K refines H when every block of K is inside a block of H. The finest partition uses singletons, the coarsest is {A}.', 'K refina H cuando cada bloque de K está dentro de un bloque de H. La más fina usa conjuntos unitarios, la menos fina es {A}.'), trap: B2('∅ can never be a block.', '∅ nunca puede ser un bloque.') },
  { g: 'sets', en: 'Tuples and Cartesian product', es: 'Tuplas y producto cartesiano', d: B2('(a₁, …, aₙ) = (b₁, …, bₙ) when aᵢ = bᵢ for every i. A₁ × … × Aₙ is the set of all n-tuples with aᵢ ∈ Aᵢ.', '(a₁, …, aₙ) = (b₁, …, bₙ) cuando aᵢ = bᵢ para todo i. A₁ × … × Aₙ es el conjunto de todas las n-tuplas con aᵢ ∈ Aᵢ.'), ex: '|A × B × C| = |A| · |B| · |C| = 2 · 4 · 3 = 24', tr: B2('Kuratowski: (a, b) = {{a}, {a, b}} makes pairs (and so relations and functions) into sets.', 'Kuratowski: (a, b) = {{a}, {a, b}} convierte pares (y por tanto relaciones y funciones) en conjuntos.'), trap: B2('(3, 5) ≠ (5, 3) although {3, 5} = {5, 3}. A × B ≠ B × A in general.', '(3, 5) ≠ (5, 3) aunque {3, 5} = {5, 3}. En general A × B ≠ B × A.') },
  // ---- relations
  { g: 'rel', en: 'Binary relations, inverse, composition', es: 'Relaciones binarias, inversa, composición', d: B2('R ⊆ A × B. dom(R) and range(R) are the elements that appear first or second. R⁻¹ = {(b, a) | (a, b) ∈ R}. R ∘ S = {(a, c) | ∃b (a, b) ∈ R ∧ (b, c) ∈ S}.', 'R ⊆ A × B. dom(R) y rango(R) son los elementos que aparecen primero o segundo. R⁻¹ = {(b, a) | (a, b) ∈ R}. R ∘ S = {(a, c) | ∃b (a, b) ∈ R ∧ (b, c) ∈ S}.'), ex: 'R = {(1, 2), (2, 3)}:  R ∘ R = R² = {(1, 3)}', tr: B2('Represent R as a table (matrix), as points, or as a graph with arrows. Rⁿ: paths of n arrows.', 'Representa R como tabla (matriz), como puntos o como grafo con flechas. Rⁿ: caminos de n flechas.'), trap: B2('Here R ∘ S means first R, then S. For functions the notation flips: (g ∘ f)(x) = g(f(x)) means first f.', 'Aquí R ∘ S significa primero R y luego S. En funciones la notación se invierte: (g ∘ f)(x) = g(f(x)) significa primero f.'), go: () => showTab('rel') },
  { g: 'rel', en: 'Properties of a relation on A', es: 'Propiedades de una relación en A', d: B2('Reflexive: every (x, x). Irreflexive: no (x, x). Symmetric: (x, y) ⇒ (y, x). Asymmetric: (x, y) ⇒ (y, x) ∉ R. Antisymmetric: (x, y) and (y, x) ⇒ x = y. Transitive: (x, y), (y, z) ⇒ (x, z).', 'Reflexiva: todos los (x, x). Irreflexiva: ningún (x, x). Simétrica: (x, y) ⇒ (y, x). Asimétrica: (x, y) ⇒ (y, x) ∉ R. Antisimétrica: (x, y) y (y, x) ⇒ x = y. Transitiva: (x, y), (y, z) ⇒ (x, z).'), ex: 'matrix: full diagonal = reflexive; mirror image across the diagonal = symmetric\ngraph: every arrow has a return arrow = symmetric', tr: B2('Alternative definitions: reflexive ⇔ I_A ⊆ R; symmetric ⇔ R = R⁻¹; transitive ⇔ R ∘ R ⊆ R. Asymmetric ⇒ irreflexive and antisymmetric.', 'Definiciones alternativas: reflexiva ⇔ I_A ⊆ R; simétrica ⇔ R = R⁻¹; transitiva ⇔ R ∘ R ⊆ R. Asimétrica ⇒ irreflexiva y antisimétrica.'), trap: B2('The empty relation is symmetric, asymmetric, antisymmetric and transitive, and irreflexive, but not reflexive. “Not symmetric” is not the same as antisymmetric.', 'La relación vacía es simétrica, asimétrica, antisimétrica, transitiva e irreflexiva, pero no reflexiva. «No simétrica» no es lo mismo que antisimétrica.'), go: () => showTab('rel') },
  { g: 'rel', en: 'Closures', es: 'Cierres', d: B2('The closure of R with a property is the smallest relation containing R with that property. Reflexive: R ∪ I_A. Symmetric: R ∪ R⁻¹. Transitive: R ∪ R² ∪ R³ ∪ …, stopping when no new pair appears.', 'El cierre de R con una propiedad es la menor relación que contiene a R y la tiene. Reflexivo: R ∪ I_A. Simétrico: R ∪ R⁻¹. Transitivo: R ∪ R² ∪ R³ ∪ …, parando cuando no aparece ningún par nuevo.'), ex: 'R = {(1,2), (2,3), (3,4), (4,5)}\nR² adds (1,3), (2,4), (3,5); R³ adds (1,4), (2,5); R⁴ adds (1,5)', tr: B2('For the equivalence closure do reflexive and symmetric first (any order) and transitive LAST.', 'Para el cierre de equivalencia haz primero el reflexivo y el simétrico (en cualquier orden) y el transitivo AL FINAL.'), trap: B2('Doing the transitive closure before the symmetric one can leave pairs out.', 'Hacer el cierre transitivo antes que el simétrico puede dejar pares fuera.'), go: () => showTab('rel') },
  { g: 'rel', en: 'Equivalence relations and classes', es: 'Relaciones de equivalencia y clases', d: B2('Reflexive, symmetric and transitive. The class of a is [a] = {x | (a, x) ∈ R}. The quotient set A/R = {[a] | a ∈ A} is a partition of A.', 'Reflexiva, simétrica y transitiva. La clase de a es [a] = {x | (a, x) ∈ R}. El conjunto cociente A/R = {[a] | a ∈ A} es una partición de A.'), ex: 'x ≡ y (mod 3) on {0, …, 8}: [0] = {0, 3, 6}, [1] = {1, 4, 7}, [2] = {2, 5, 8}', tr: B2('(a, b) ∈ R ⇔ [a] = [b]: any element of a class can name it. Classes are either equal or disjoint.', '(a, b) ∈ R ⇔ [a] = [b]: cualquier elemento de una clase puede nombrarla. Las clases son iguales o disjuntas.'), trap: B2('A/R has one class per distinct class, not one per element.', 'A/R tiene una clase por cada clase distinta, no una por elemento.'), go: () => showTab('rel') },
  { g: 'rel', en: 'Orders and Hasse diagrams', es: 'Órdenes y diagramas de Hasse', d: B2('Partial order: reflexive, antisymmetric and transitive (notation ⪯, a poset). Total: any two elements comparable. Strict partial order: irreflexive and transitive (hence asymmetric).', 'Orden parcial: reflexiva, antisimétrica y transitiva (notación ⪯, un cpo). Total: dos elementos cualesquiera comparables. Orden parcial estricto: irreflexiva y transitiva (luego asimétrica).'), ex: '“divides” on {1, …, 8}: partial, not total (3 and 7 are incomparable)\n≤ on ℝ: total · ⊂: strict partial', tr: B2('Hasse diagram: draw only the cover pairs (b covers a: a ⪯ b, a ≠ b, nothing in between), the larger element above, without loops or transitive arrows.', 'Diagrama de Hasse: dibuja sólo los pares de cobertura (b cubre a: a ⪯ b, a ≠ b, nada entre medias), el mayor arriba, sin lazos ni flechas transitivas.'), trap: B2('Transitive + reflexive is only a preorder: it may still contain cycles like 5 ⪯ 6 ⪯ 5.', 'Transitiva + reflexiva es sólo un preorden: aún puede tener ciclos como 5 ⪯ 6 ⪯ 5.'), go: () => showTab('rel') },
  { g: 'rel', en: 'Maximal, maximum, bounds, supremum', es: 'Maximal, máximo, cotas, supremo', d: B2('In S: maximal = nothing above it; maximum = above everything (unique if it exists). For S ⊆ P: an upper bound is any element of P above all of S; the supremum is the least upper bound. Dually minimal, minimum, lower bound, infimum.', 'En S: maximal = nada por encima; máximo = por encima de todos (único si existe). Para S ⊆ P: cota superior es cualquier elemento de P por encima de todo S; el supremo es la menor cota superior. Dualmente minimal, mínimo, cota inferior, ínfimo.'), ex: 'P(A) with ⊆, S = {{1}, {1,2}, {1,3}}\nsup S = {1,2,3}, inf S = {1} = min S', tr: B2('In a divisibility order the supremum is the lcm and the infimum the gcd, when they belong to the set.', 'En el orden de divisibilidad el supremo es el mcm y el ínfimo el mcd, si pertenecen al conjunto.'), trap: B2('Maximal and maximum must belong to S; bounds need not. The infimum of ℝ⁺ is 0, which is not a minimum.', 'Maximales y máximo deben pertenecer a S; las cotas no. El ínfimo de ℝ⁺ es 0, que no es mínimo.'), go: () => showTab('rel') },
  // ---- functions
  { g: 'fun', en: 'Functions', es: 'Funciones', d: B2('A relation f ⊆ A × B is a function from A to B when every x ∈ A has exactly one image y ∈ B, written f(x) = y. Domain A, codomain B, range = the images actually reached.', 'Una relación f ⊆ A × B es función de A en B cuando todo x ∈ A tiene exactamente una imagen y ∈ B, escrita f(x) = y. Dominio A, codominio B, rango = las imágenes que se alcanzan.'), ex: '√ : ℝ≥0 → ℝ≥0 is a function; y² = x on ℝ × ℝ is not', tr: B2('In an arrow diagram exactly one arrow leaves each element of A; elements of B may receive any number.', 'En un diagrama de flechas sale exactamente una flecha de cada elemento de A; los de B pueden recibir cualquier número.'), trap: B2('A “functional relation” (at most one image) is only a partial function: some x may have no image.', 'Una «relación funcional» (a lo sumo una imagen) es sólo una función parcial: algún x puede no tener imagen.'), go: () => showTab('fun') },
  { g: 'fun', en: 'Injective, surjective, bijective', es: 'Inyectiva, sobreyectiva, biyectiva', d: B2('Injective: f(x₁) = f(x₂) ⇒ x₁ = x₂. Surjective: every y ∈ B has some x with f(x) = y. Bijective: both; then f⁻¹ : B → A exists.', 'Inyectiva: f(x₁) = f(x₂) ⇒ x₁ = x₂. Sobreyectiva: todo y ∈ B tiene algún x con f(x) = y. Biyectiva: ambas; entonces existe f⁻¹ : B → A.'), ex: 'f(x) = 5x + 7: 5x₁ + 7 = 5x₂ + 7 ⇒ x₁ = x₂ (injective)', tr: B2('Finite sets: injective ⇒ |A| ≤ |B|; surjective ⇒ |A| ≥ |B|; bijective ⇒ |A| = |B|.', 'Conjuntos finitos: inyectiva ⇒ |A| ≤ |B|; sobreyectiva ⇒ |A| ≥ |B|; biyectiva ⇒ |A| = |B|.'), trap: B2('Whether f is surjective depends on the codomain you declare, not only on the formula.', 'Que f sea sobreyectiva depende del codominio que declares, no sólo de la fórmula.'), go: () => showTab('fun') },
  { g: 'fun', en: 'Composition of functions', es: 'Composición de funciones', d: B2('For f : A → B and g : B → C, (g ∘ f)(x) = g(f(x)). Composition is associative; f ∘ i_A = f, i_B ∘ f = f; f⁻¹ ∘ f = i_A.', 'Para f : A → B y g : B → C, (g ∘ f)(x) = g(f(x)). La composición es asociativa; f ∘ i_A = f, i_B ∘ f = f; f⁻¹ ∘ f = i_A.'), ex: 'f(x) = 3·sen(x²) + 1 = (f_{x+1} ∘ f_{3x} ∘ f_sen ∘ f_{x²})(x)', tr: B2('Injective ∘ injective is injective; surjective ∘ surjective is surjective.', 'Inyectiva ∘ inyectiva es inyectiva; sobreyectiva ∘ sobreyectiva es sobreyectiva.'), trap: B2('Read g ∘ f right to left. Usually g ∘ f ≠ f ∘ g, and one of them may not even be defined.', 'g ∘ f se lee de derecha a izquierda. En general g ∘ f ≠ f ∘ g, y una de ellas puede ni estar definida.'), go: () => showTab('fun') },
  { g: 'fun', en: 'Cardinality and countable sets', es: 'Cardinalidad y conjuntos numerables', d: B2('|A| = |B| when there is a bijection A → B. A is countable when there is an injection A → ℕ. |A| < |B| when there is an injection A → B but no bijection.', '|A| = |B| cuando hay una biyección A → B. A es numerable cuando hay una inyección A → ℕ. |A| < |B| cuando hay inyección A → B pero no biyección.'), ex: '|ℕ| = |ℤ| = |ℚ| < |ℝ| · |A| < |P(A)|', tr: B2('To show a set is countable, list it without repetitions: ℤ = 0, −1, 1, −2, 2, …', 'Para ver que un conjunto es numerable, lístalo sin repetir: ℤ = 0, −1, 1, −2, 2, …'), trap: B2('Cantor’s diagonal: any list of functions ℕ → B (with |B| ≥ 2) misses the function that changes the diagonal; so ℝ is not countable.', 'Diagonal de Cantor: cualquier lista de funciones ℕ → B (con |B| ≥ 2) deja fuera la función que cambia la diagonal; por eso ℝ no es numerable.') },
  { g: 'fun', en: 'Homomorphisms and monotone functions', es: 'Homomorfismos y funciones monótonas', d: B2('f : A → B is a homomorphism when f(a₁ ∗ a₂) = f(a₁) ∗′ f(a₂); a bijective homomorphism is an isomorphism. Between posets, f is monotone when s₁ ⪯ s₂ ⇒ f(s₁) ⪯ f(s₂).', 'f : A → B es un homomorfismo cuando f(a₁ ∗ a₂) = f(a₁) ∗′ f(a₂); un homomorfismo biyectivo es un isomorfismo. Entre cpos, f es monótona cuando s₁ ⪯ s₂ ⇒ f(s₁) ⪯ f(s₂).'), ex: 'f(x) = diag(x, x): ℝ → 2×2 matrices preserves + and ×', tr: B2('An isomorphism means the two structures behave identically up to renaming.', 'Un isomorfismo significa que las dos estructuras se comportan igual salvo nombres.'), trap: B2('A homomorphism need not be injective: B can be a “shadow” of A.', 'Un homomorfismo no tiene por qué ser inyectivo: B puede ser una «sombra» de A.') },
  // ---- combinatorics
  { g: 'comb', en: 'Counting principles', es: 'Principios de conteo', d: B2('Sum: |A ∪ B| = |A| + |B| for disjoint sets. Product: |A × B| = |A| · |B|. Inclusion–exclusion: |A ∪ B| = |A| + |B| − |A ∩ B|.', 'Suma: |A ∪ B| = |A| + |B| si son disjuntos. Producto: |A × B| = |A| · |B|. Inclusión–exclusión: |A ∪ B| = |A| + |B| − |A ∩ B|.'), ex: '|A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|\n6 + 5 + 6 − 3 − 3 − 3 + 2 = 10', tr: B2('Signs alternate: + singles, − pairs, + triples, − quadruples…', 'Los signos alternan: + individuales, − parejas, + tríos, − cuartetos…'), trap: B2('Use the sum principle only when the cases do not overlap.', 'Usa el principio de la suma sólo si los casos no se solapan.'), go: () => showTab('comb') },
  { g: 'comb', en: 'Factorial, binomial coefficient, Pascal', es: 'Factorial, número combinatorio, Pascal', d: B2('n! = 1 · 2 · … · n, 0! = 1. C(m, n) = m! / (n! (m − n)!), the number of n-element subsets of an m-element set.', 'n! = 1 · 2 · … · n, 0! = 1. C(m, n) = m! / (n! (m − n)!), el número de subconjuntos de n elementos de un conjunto de m.'), ex: 'C(4, 2) = 4·3/2! = 6 · (x + y)ⁿ = Σ C(n, k) xⁿ⁻ᵏ yᵏ', tr: B2('C(m, n) = C(m, m − n): compute with the smaller one. Cancel before multiplying: C(10, 5) = 10·9·8·7·6 / 5! = 252.', 'C(m, n) = C(m, m − n): calcula con el menor. Simplifica antes de multiplicar: C(10, 5) = 10·9·8·7·6 / 5! = 252.'), trap: B2('Row n of Pascal’s triangle starts with C(n, 0): position k + 1 holds C(n, k).', 'La fila n del triángulo de Pascal empieza en C(n, 0): la posición k + 1 contiene C(n, k).'), go: () => showTab('comb') },
  { g: 'comb', en: 'Variations', es: 'Variaciones', d: B2('Ordered n-tuples taken from m elements. Without repetition V(m, n) = m!/(m − n)!; with repetition VR(m, n) = mⁿ.', 'n-tuplas ordenadas tomadas de m elementos. Sin repetición V(m, n) = m!/(m − n)!; con repetición VR(m, n) = mⁿ.'), ex: '4 roles from 10 actors: V = 10·9·8·7 = 5040\n8-bit words: VR(2, 8) = 2⁸ = 256', tr: B2('V(m, n) is n factors counting down from m.', 'V(m, n) son n factores bajando desde m.'), trap: B2('In VR(m, n) the exponent is the number of positions, the base the number of options: 2⁸, not 8².', 'En VR(m, n) el exponente es el número de posiciones y la base el de opciones: 2⁸, no 8².'), go: () => showTab('comb') },
  { g: 'comb', en: 'Permutations', es: 'Permutaciones', d: B2('Orderings of all n elements: Pₙ = n!. With repeated elements (r₁ of one kind, r₂ of another, …): PRₙ = n!/(r₁! r₂! … rₖ!).', 'Ordenaciones de los n elementos: Pₙ = n!. Con elementos repetidos (r₁ de un tipo, r₂ de otro, …): PRₙ = n!/(r₁! r₂! … rₖ!).'), ex: '5 coupons, 3 lots, 2 trips to 10 clients: 10!/(5!·3!·2!) = 2520\nBANANA: 6!/(3!·2!·1!) = 60', tr: B2('Dividing by rᵢ! removes the orderings that swap identical elements.', 'Dividir entre rᵢ! elimina las ordenaciones que sólo intercambian elementos iguales.'), trap: B2('The rᵢ must add up to n.', 'Los rᵢ deben sumar n.'), go: () => showTab('comb') },
  { g: 'comb', en: 'Combinations and the decision tree', es: 'Combinaciones y el árbol de decisión', d: B2('Unordered selections. Without repetition C(m, n); with repetition CR(m, n) = C(m + n − 1, n).', 'Selecciones sin orden. Sin repetición C(m, n); con repetición CR(m, n) = C(m + n − 1, n).'), ex: 'order? yes → all taken? yes → repeated? PR / P\n               all taken? no → repetition? VR / V\norder? no → repetition? CR / C', tr: B2('CR: n stars and m − 1 bars; choose where the stars go. 4 cakes of 6 kinds: C(9, 4) = 126.', 'CR: n estrellas y m − 1 barras; elige dónde van las estrellas. 4 pasteles de 6 tipos: C(9, 4) = 126.'), trap: B2('A committee is a combination; a committee with roles (president, secretary) is a variation.', 'Un comité es una combinación; un comité con cargos (presidente, secretario) es una variación.'), go: () => showTab('comb') },
  // ---- graphs
  { g: 'graph', en: 'Graphs and edge types', es: 'Grafos y tipos de aristas', d: B2('G = (V, E) with V non-empty. Undirected edges are sets {a, b}; directed edges (arcs) are pairs (a, b). Loops join a vertex to itself; multiple edges join the same vertices (multigraph); weighted edges carry a number.', 'G = (V, E) con V no vacío. Las aristas no dirigidas son conjuntos {a, b}; las dirigidas (arcos) son pares (a, b). Un lazo une un vértice consigo mismo; las aristas múltiples unen los mismos vértices (multigrafo); las ponderadas llevan un número.'), ex: 'V = {a, b, c}, E = {{a, b}} · E = {(a, b), (b, a), (c, a)}', tr: B2('Adjacent vertices share an edge; adjacent edges share a vertex. A null graph has no edges.', 'Vértices adyacentes comparten una arista; aristas adyacentes comparten un vértice. Un grafo nulo no tiene aristas.'), trap: B2('Two drawings can be the same graph: compare V and E, not the picture.', 'Dos dibujos pueden ser el mismo grafo: compara V y E, no el dibujo.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Degrees', es: 'Grados', d: B2('Degree = number of edge ends at the vertex. Directed: in-degree (arrows arriving) and out-degree (arrows leaving). Isolated vertex: degree 0. k-regular: every vertex has degree k.', 'Grado = número de extremos de arista en el vértice. Dirigido: grado de entrada (flechas que llegan) y de salida (que salen). Vértice aislado: grado 0. k-regular: todos los vértices tienen grado k.'), ex: 'Σ deg(v) = 2·|E|  ·  directed: Σ in = Σ out = |E|', tr: B2('Handshake lemma: the number of odd-degree vertices is even. Kₙ has n(n − 1)/2 edges.', 'Lema del apretón de manos: el número de vértices de grado impar es par. Kₙ tiene n(n − 1)/2 aristas.'), trap: B2('A loop adds 2 to the degree (1 in, 1 out if directed).', 'Un lazo suma 2 al grado (1 de entrada y 1 de salida si es dirigido).'), go: () => showTab('graph') },
  { g: 'graph', en: 'Representations', es: 'Representaciones', d: B2('Adjacency matrix |V| × |V|: 1 (or the weight, or the multiplicity) where an edge goes from row to column. Adjacency list: the neighbours of each vertex. Incidence matrix |V| × |E|: 1 where a vertex touches an edge (directed: 1 at the origin, −1 at the destination).', 'Matriz de adyacencia |V| × |V|: 1 (o el peso, o la multiplicidad) donde hay arista de la fila a la columna. Lista de adyacencia: los vecinos de cada vértice. Matriz de incidencia |V| × |E|: 1 donde un vértice toca una arista (dirigido: 1 en el origen, −1 en el destino).'), ex: 'undirected: symmetric matrix, a loop counts 2 on the diagonal', tr: B2('Row sums give out-degrees, column sums in-degrees.', 'Las sumas de fila dan los grados de salida, las de columna los de entrada.'), trap: B2('A matrix alone does not say whether the graph is weighted or a multigraph: say which.', 'Una matriz sola no dice si el grafo es ponderado o un multigrafo: hay que indicarlo.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Subgraphs and special graphs', es: 'Subgrafos y grafos especiales', d: B2('G′ = (V′, E′) is a subgraph when V′ ⊆ V and E′ ⊆ E (edges only between vertices of V′). Induced by V′: all the edges of G between them. Spanning: V′ = V. Kₙ: complete. Complement: the edges of Kₙ not in G. Bipartite: V splits into two sides with edges only across.', 'G′ = (V′, E′) es subgrafo si V′ ⊆ V y E′ ⊆ E (aristas sólo entre vértices de V′). Inducido por V′: todas las aristas de G entre ellos. Expandido: V′ = V. Kₙ: completo. Complementario: las aristas de Kₙ que no están en G. Bipartito: V se divide en dos lados con aristas sólo entre ellos.'), ex: 'G ∪ complement(G) = Kₙ', tr: B2('Isomorphic graphs: a bijection of vertices preserving adjacency. Quick test: same degree sequence (necessary, not sufficient).', 'Grafos isomorfos: una biyección de vértices que conserva la adyacencia. Prueba rápida: misma secuencia de grados (necesaria, no suficiente).'), trap: B2('Removing a vertex removes its edges too; removing an edge keeps its vertices.', 'Quitar un vértice quita también sus aristas; quitar una arista conserva sus vértices.') },
  { g: 'graph', en: 'Paths, cycles, distance', es: 'Caminos, ciclos, distancia', d: B2('A path is a sequence of adjacent edges; length = number of edges (or total weight). Simple path (camino sencillo): no repeated edge. Elementary path: no repeated vertex. A cycle is a simple path that returns to its start; elementary cycle if no other vertex repeats. A walk (paseo) may repeat anything.', 'Un camino es una sucesión de aristas adyacentes; longitud = número de aristas (o peso total). Camino sencillo: no repite aristas. Camino elemental: no repite vértices. Un ciclo es un camino sencillo que vuelve al inicio; elemental si no repite otros vértices. Un paseo puede repetirlo todo.'), ex: 'distance(a, e) = length of a shortest path', tr: B2('Every elementary path is simple, not the other way round.', 'Todo camino elemental es sencillo, no al revés.'), trap: B2('Reachability matrix: every vertex reaches itself (diagonal of 1s).', 'Matriz de accesibilidad: todo vértice se alcanza a sí mismo (diagonal de unos).') },
  { g: 'graph', en: 'Euler and Hamilton', es: 'Euler y Hamilton', d: B2('Euler path: uses every edge exactly once; Euler cycle if it ends where it starts. Hamilton path: visits every vertex exactly once; Hamilton cycle if it closes.', 'Camino euleriano: usa cada arista exactamente una vez; ciclo euleriano si acaba donde empieza. Camino hamiltoniano: visita cada vértice exactamente una vez; ciclo hamiltoniano si se cierra.'), ex: 'Königsberg: degrees 3, 5, 3, 3 → no Euler path\nhouse: degrees 2, 4, 4, 3, 3 → Euler path from d to e', tr: B2('Connected undirected graph: Euler cycle ⇔ all degrees even; Euler path ⇔ 0 or 2 odd vertices (start at one of them). Fleury: never cross a bridge if you have another choice.', 'Grafo no dirigido conexo: ciclo euleriano ⇔ todos los grados pares; camino euleriano ⇔ 0 o 2 vértices impares (empieza en uno). Fleury: no cruces un puente si tienes otra opción.'), trap: B2('No simple degree test exists for Hamilton. Every Kₙ with n ≥ 3 is Hamiltonian.', 'No hay test de grados para Hamilton. Todo Kₙ con n ≥ 3 es hamiltoniano.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Connectivity', es: 'Conectividad', d: B2('Strongly connected: a path in both directions between any two vertices. Unilaterally: in at least one direction. Weakly: connected when the directions are ignored. A component is the subgraph induced by vertices joined by paths. Cut point / bridge: a vertex / edge whose removal increases the number of components. Root: a vertex with a path to every other.', 'Fuertemente conexo: camino en ambos sentidos entre cualquier par. Unilateralmente: en al menos un sentido. Débilmente: conexo ignorando las direcciones. Una componente es el subgrafo inducido por vértices unidos por caminos. Punto de corte / puente: vértice / arista cuya eliminación aumenta el número de componentes. Raíz: vértice con camino a todos los demás.'), ex: 'strong ⇒ unilateral ⇒ weak', tr: B2('Use the reachability matrix: all 1s → strong; for every 0 the mirrored cell is 1 → unilateral.', 'Usa la matriz de accesibilidad: todo unos → fuerte; cada 0 tiene un 1 en su simétrica → unilateral.'), trap: B2('In an undirected graph connected already means strongly connected.', 'En un grafo no dirigido, conexo ya significa fuertemente conexo.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Traversals and topological order', es: 'Recorridos y orden topológico', d: B2('Depth-first: go as far as possible, backtrack when stuck (stack). Breadth-first: visit all successors of the current vertex before moving on (queue); it orders by distance. By levels: start with all vertices without predecessors.', 'En profundidad: avanza lo más lejos posible y retrocede cuando no puedas (pila). En anchura: visita todos los sucesores del vértice actual antes de seguir (cola); ordena por distancia. Por niveles: empieza con todos los vértices sin predecesores.'), ex: 'BFS from a: (a, c, f, e, g, b)\nlevels: {c, a}, {g, e}, {d, f}, {b}', tr: B2('A topological order of a DAG lists each vertex before its successors; the level traversal of a DAG gives one.', 'Un orden topológico de un DAG pone cada vértice antes que sus sucesores; el recorrido por niveles de un DAG da uno.'), trap: B2('A graph can have many DFS and BFS orders: they depend on which neighbour you pick first.', 'Un grafo puede tener muchos recorridos DFS y BFS: dependen de qué vecino eliges primero.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Trees and spanning trees', es: 'Árboles y árboles de expansión', d: B2('A tree is a connected acyclic undirected graph (exactly one path between any two vertices); a forest is acyclic, a union of trees. A spanning tree contains every vertex; a minimum spanning tree has the least total weight (Kruskal).', 'Un árbol es un grafo no dirigido conexo y acíclico (exactamente un camino entre dos vértices); un bosque es acíclico, una unión de árboles. Un árbol de expansión contiene todos los vértices; uno mínimo tiene el menor peso total (Kruskal).'), ex: 'n vertices ⇒ n − 1 edges, total degree 2(n − 1)', tr: B2('Rooted tree: level = distance to the root, height = maximum level; parent, children, siblings, leaves, ancestors, descendants. Binary: at most 2 children.', 'Árbol con raíz: nivel = distancia a la raíz, altura = nivel máximo; padre, hijos, hermanos, hojas, ascendientes, descendientes. Binario: a lo sumo 2 hijos.'), trap: B2('In a tree every edge is a bridge, and adding any edge creates exactly one cycle.', 'En un árbol toda arista es un puente, y añadir cualquier arista crea exactamente un ciclo.'), go: () => showTab('graph') },
  { g: 'graph', en: 'Planarity and colouring', es: 'Planaridad y coloreado', d: B2('Planar: can be drawn without crossing edges. Necessary conditions (v ≥ 3): e ≤ 3v − 6; without triangles, e ≤ 2v − 4. The chromatic number χ is the least number of colours with adjacent vertices different.', 'Plano: se puede dibujar sin cruces. Condiciones necesarias (v ≥ 3): e ≤ 3v − 6; sin triángulos, e ≤ 2v − 4. El número cromático χ es el mínimo de colores con vértices adyacentes distintos.'), ex: 'K₅: 10 > 9 → not planar · K₃,₃: 9 > 8 → not planar', tr: B2('χ = 1: no edges. χ = 2: bipartite. Planar graphs have χ ≤ 4 (four colour theorem).', 'χ = 1: sin aristas. χ = 2: bipartito. Los grafos planos tienen χ ≤ 4 (teorema de los cuatro colores).'), trap: B2('The edge bounds can only prove a graph is NOT planar; meeting them proves nothing.', 'Las cotas de aristas sólo sirven para probar que un grafo NO es plano; cumplirlas no prueba nada.'), go: () => showTab('graph') },
];
let NF_ = load('nfilter') || 'all';
function init_theory() { RENDER.theory = renderNotes; renderNotes(); }
function renderNotes() {
  $('nfilter').innerHTML = `<button aria-pressed="${NF_ === 'all'}" onclick="NF_='all';save('nfilter',NF_);renderNotes()">${T('All topics', 'Todos los temas')}</button>` + NGROUPS.map(([id, en, es]) => `<button aria-pressed="${NF_ === id}" onclick="NF_='${id}';save('nfilter',NF_);renderNotes()">${T(en, es)}</button>`).join('');
  const groups = NGROUPS.filter(([id]) => NF_ === 'all' || NF_ === id);
  $('notes').innerHTML = groups.map(([id, en, es]) => `<div class="ghead">${T(en, es)}</div><div class="notes">${NOTES.map((n, k) => [n, k]).filter(([n]) => n.g === id).map(([n, k]) => `<article class="note"><h3>${T(n.en, n.es)}</h3><span class="alt">${lang === 'es' ? 'EN: ' + esc(n.en) : 'ES: ' + esc(n.es)}</span><p>${TT(n.d)}</p>${n.ex ? `<div><span class="lbl">${T('Example', 'Ejemplo')}</span><div class="f">${esc(typeof n.ex === 'string' ? n.ex : TT(n.ex))}</div></div>` : ''}<div><span class="lbl">${T('Trick', 'Truco')}</span><p>${TT(n.tr)}</p></div><div><span class="lbl">${T('Exam trap', 'Trampa de examen')}</span><p>${TT(n.trap)}</p></div>${n.go ? `<button class="try" onclick="NOTES[${k}].go()">${T('Try it →', 'Probarlo →')}</button>` : ''}</article>`).join('')}</div>`).join('');
}
function ndOpen(k) { showTab('nd'); ndLoad(k, true); }
function foOpen(s) { FO.src = s; save('fosrc', s); if (INIT.fo) { $('foin').value = s; } showTab('fo'); if (INIT.fo) foCompute(); }

// ===================== BOOT =====================
(function boot() {
  applyStatic();
  const h = (location.hash || '').replace('#', '');
  showTab(TABS.includes(h) ? h : (TABS.includes(load('room')) ? load('room') : 'lab'));
})();

</script>
